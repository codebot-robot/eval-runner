<!doctype html><html><head><style>{{ base_css }}
body { background: transparent; }
.cap { position: absolute; left: 96px; bottom: 84px; display: inline-flex; align-items: center; gap: 18px; background: rgba(255,255,255,.97); border: 1px solid rgba(17,24,39,.08); border-left: 6px solid var(--indigo); padding: 18px 30px 18px 26px; border-radius: 6px 14px 14px 6px; box-shadow: 0 10px 30px rgba(17,24,39,.12); font-size: 36px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
.cap .ep { font-size: 20px; color: var(--muted); font-weight: 500; font-family: var(--mono); }
</style></head><body><div class="canvas"><div class="cap">{{ text }}{% if episode %}<span class="ep">{{ series.name }} · {{ episode }}/{{ series.episodes }}</span>{% endif %}</div></div></body></html>
