---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: runs.evalrunner.gke-labs.dev
spec:
  group: evalrunner.gke-labs.dev
  names:
    kind: Run
    listKind: RunList
    plural: runs
    shortNames:
    - run
    singular: run
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Run is the Schema for the runs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RunSpec defines the desired state of Run.
            properties:
              limit:
                description: Limit is an optional per-task cap on samples (passed
                  to Inspect as --limit).
                type: integer
              model:
                description: |-
                  Model is the Inspect model identifier (e.g. mockllm/model, google/gemini-3.5-flash-lite).
                  If empty, the Run stops after discovery.
                type: string
              repo:
                description: Repo specifies the repository and commit to run.
                properties:
                  commit:
                    description: Commit is the exact git commit SHA to checkout.
                    pattern: ^[0-9a-fA-F]{7,64}$
                    type: string
                  url:
                    description: URL is the git clone URL for the repository under
                      test.
                    type: string
                required:
                - commit
                - url
                type: object
              tasks:
                description: |-
                  Tasks is an optional allow-list of task IDs to run.
                  If empty, all tasks with empty resources are eligible.
                items:
                  type: string
                type: array
            required:
            - repo
            type: object
          status:
            description: RunStatus defines the observed state of Run.
            properties:
              conditions:
                description: Conditions represent the latest observations of the Run's
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              discoveryDeadline:
                description: DiscoveryDeadline is the deadline by which discovery
                  must complete.
                format: date-time
                type: string
              executionDeadline:
                description: ExecutionDeadline is the deadline by which sample execution
                  must complete.
                format: date-time
                type: string
              manifest:
                description: Manifest is the parsed output of .evals/list once discovery
                  completes.
                properties:
                  images:
                    description: Images lists the images declared by the repository.
                    items:
                      description: ManifestImage describes a container image needed
                        by eval tasks.
                      properties:
                        context:
                          description: Context is the build context directory path
                            within the repository.
                          type: string
                        name:
                          description: Name is the image name / tag.
                          type: string
                      required:
                      - context
                      - name
                      type: object
                    type: array
                  tasks:
                    description: Tasks lists all discovered eval tasks.
                    items:
                      description: ManifestTask describes a single eval task discovered
                        from .evals/list.
                      properties:
                        id:
                          description: ID is the unique stable identifier for the
                            task (e.g. triage/runbook_lookup).
                          type: string
                        images:
                          description: Images specifies which images built from the
                            manifest this task requires.
                          items:
                            type: string
                          type: array
                        resources:
                          description: Resources specifies the declarative resource
                            requirements for the task.
                          items:
                            description: ManifestResource describes a resource needed
                              by an eval task.
                            properties:
                              type:
                                description: Type is the resource type (e.g., docker,
                                  kind, kubernetes-namespace).
                                type: string
                            required:
                            - type
                            type: object
                          type: array
                        spec:
                          description: Spec is the framework-specific task reference
                            (e.g. file.py@task_fn).
                          type: string
                        workdir:
                          description: Workdir is the directory to run the task from.
                          type: string
                      required:
                      - id
                      - spec
                      type: object
                    type: array
                required:
                - tasks
                type: object
              message:
                description: Message is human-readable detail on failure or current
                  status.
                type: string
              phase:
                description: Phase is the current lifecycle phase of the Run.
                enum:
                - Pending
                - Discovering
                - Discovered
                - Running
                - Completed
                - Failed
                type: string
              tasks:
                description: Tasks records the status and results for each executed
                  eval task.
                items:
                  description: TaskStatus records the execution status and scores
                    for a single eval task.
                  properties:
                    id:
                      description: ID is the unique identifier of the task (e.g. docs/readme_comprehension).
                      type: string
                    logPath:
                      description: LogPath is the path or URI where the Inspect log
                        was stored by the artifact sink.
                      type: string
                    meanScore:
                      description: MeanScore is the mean of per-sample scores in [0,
                        1].
                      type: number
                    message:
                      description: Message contains failure detail or bounded error
                        information.
                      type: string
                    phase:
                      description: Phase is the current execution phase of this task.
                      enum:
                      - Pending
                      - Running
                      - Completed
                      - Failed
                      type: string
                    samples:
                      description: Samples is the number of samples scored.
                      type: integer
                    successes:
                      description: Successes is the number of samples with score ==
                        1 (for binary scorers).
                      type: integer
                  required:
                  - id
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
