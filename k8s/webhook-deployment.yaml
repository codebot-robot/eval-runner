apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-runner-webhook
  namespace: eval-runner
  labels:
    app: eval-runner-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval-runner-webhook
  template:
    metadata:
      labels:
        app: eval-runner-webhook
    spec:
      serviceAccountName: eval-runner-webhook
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: webhook
        image: eval-runner-webhook
        args:
        - --namespace=eval-runner
        - --listen-addr=:8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eval-runner-webhook
  namespace: eval-runner
  labels:
    app: eval-runner-webhook
spec:
  selector:
    app: eval-runner-webhook
  ports:
  - name: http
    port: 80
    targetPort: 8080
