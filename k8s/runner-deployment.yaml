apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-runner-controller
  namespace: eval-runner
  labels:
    app: eval-runner-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval-runner-controller
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        # Declares the sample-runner image dependency so ap deploy builds and pushes it.
        # The controller derives this image at runtime (see controller.DeriveSampleRunnerImage).
        evalrunner.gke-labs.dev/sample-runner-image: "${IMAGE_PREFIX}/sample-runner:${IMAGE_TAG}"
      labels:
        app: eval-runner-controller
    spec:
      serviceAccountName: eval-runner-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: controller
        image: eval-runner
        args:
        - --namespace=eval-runner
        - --sandbox-namespace=eval-runner-sandbox
        - --health-probe-bind-address=:8081
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: model-credentials
              key: GEMINI_API_KEY
              optional: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: gcp-token
          mountPath: /var/run/secrets/eval-runner/gcp
          readOnly: true
        - name: service-portal-ca
          mountPath: /etc/service-portal
          readOnly: true
        - name: service-portal-token
          mountPath: /var/run/secrets/service-portal
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: tmp
        emptyDir: {}
      - name: gcp-token
        projected:
          sources:
          - serviceAccountToken:
              audience: eval-runner.gke-labs.dev/gcp-workload-identity
              expirationSeconds: 3600
              path: token
      # Written into the eval-runner namespace by the service-portals install step; optional so the controller starts before the portal is installed.
      - name: service-portal-ca
        secret:
          secretName: service-portal-controller-ca
          optional: true
      - name: service-portal-token
        projected:
          sources:
          - serviceAccountToken:
              audience: "https://service-portal-controller"
              expirationSeconds: 3600
              path: token
