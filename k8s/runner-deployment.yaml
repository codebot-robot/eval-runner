apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-runner-controller
  namespace: eval-runner
  labels:
    app: eval-runner-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval-runner-controller
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        app: eval-runner-controller
    spec:
      serviceAccountName: eval-runner-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: controller
        image: eval-runner
        args:
        - --namespace=eval-runner
        - --sandbox-namespace=eval-runner-sandbox
        - --health-probe-bind-address=:8081
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GOOGLE_APPLICATION_CREDENTIALS
          valueFrom:
            configMapKeyRef:
              name: eval-runner-gcp-credentials
              key: GOOGLE_APPLICATION_CREDENTIALS
              optional: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: gcp-credentials
          mountPath: /etc/eval-runner/gcp
          readOnly: true
        - name: gcp-token
          mountPath: /var/run/secrets/eval-runner/gcp
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: tmp
        emptyDir: {}
      - name: gcp-credentials
        configMap:
          name: eval-runner-gcp-credentials
          optional: true
      - name: gcp-token
        projected:
          sources:
          - serviceAccountToken:
              audience: eval-runner.gke-labs.dev/gcp-workload-identity
              expirationSeconds: 3600
              path: token
