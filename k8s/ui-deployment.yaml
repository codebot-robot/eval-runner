apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-runner-ui
  namespace: eval-runner
  labels:
    app: eval-runner-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval-runner-ui
  template:
    metadata:
      labels:
        app: eval-runner-ui
    spec:
      serviceAccountName: eval-runner-ui
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ui
        image: eval-runner-ui
        args:
        - --namespace=eval-runner
        - --listen-addr=:8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GOOGLE_APPLICATION_CREDENTIALS
          valueFrom:
            configMapKeyRef:
              name: eval-runner-gcp-credentials
              key: GOOGLE_APPLICATION_CREDENTIALS
              optional: true
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: gcp-credentials
          mountPath: /etc/eval-runner/gcp
          readOnly: true
        - name: gcp-token
          mountPath: /var/run/secrets/eval-runner/gcp
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      volumes:
      - name: gcp-credentials
        configMap:
          name: eval-runner-gcp-credentials
          optional: true
      - name: gcp-token
        projected:
          sources:
          - serviceAccountToken:
              audience: eval-runner.gke-labs.dev/gcp-workload-identity
              expirationSeconds: 3600
              path: token
---
apiVersion: v1
kind: Service
metadata:
  name: eval-runner-ui
  namespace: eval-runner
  labels:
    app: eval-runner-ui
spec:
  selector:
    app: eval-runner-ui
  ports:
  - name: http
    port: 80
    targetPort: 8080
